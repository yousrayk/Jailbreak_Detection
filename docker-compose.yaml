services:
  pulsar:
    image: apachepulsar/pulsar:4.0.3
    command: ["bin/pulsar", "standalone"]
    ports:
      - "6650:6650"   # binary protocol (producers/consumers)
      - "8080:8080"   # admin REST API
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  topic-setup:
    image: apachepulsar/pulsar:4.0.3
    depends_on:
      pulsar:
        condition: service_healthy
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh
    entrypoint: ["bash", "/create_topics.sh"]

  producer:
    build: ./producer
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
    ports:
      - "5000:5000"

  consumer_prediction:
    build: ./consumer_prediction
    depends_on:
      pulsar:
        condition: service_healthy
      topic-setup:
        condition: service_completed_successfully
    environment:
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      MODEL_PATH: /model
    volumes:
      # Weights aren't committed to git (see .gitignore) — copy them into
      # ./models/albert_production first; see README's "Model weights" section.
      - "./models/albert_production:/model:ro"

  consumer_join:
    build: ./consumer_join
    depends_on:
      pulsar:
        condition: service_healthy
      topic-setup:
        condition: service_completed_successfully
    environment:
      PULSAR_SERVICE_URL: pulsar://pulsar:6650
      JOINED_RESULTS_PATH: /data/joined_results.jsonl
    volumes:
      # Real sink instead of a dead-end print (see ARCHITECTURE.md's "Sink
      # for joined result" decision) — visible on the host at ./data.
      - "./data:/data"

  gateway:
    build: ./gateway
    depends_on:
      - producer
      - consumer_prediction
      - consumer_join
    environment:
      GATEWAY_URL: http://producer:5000/send
      CSV_PATH: /app/test.csv
      SEND_DELAY_SECONDS: "0.2"
    volumes:
      - "./test.csv:/app/test.csv:ro"
